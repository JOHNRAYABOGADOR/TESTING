<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Personal Expense Tracker</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<h1>Personal Expense Tracker</h1>

		<section aria-labelledby="total-heading">
			<h2 id="total-heading">Total Expenses</h2>
			<p id="total-expenses">$0.00</p>
		</section>

		<section aria-labelledby="add-expense-heading">
			<h2 id="add-expense-heading">Add an Expense</h2>
			<form id="expense-form" novalidate>
				<div>
					<label for="expense-name">Description</label>
					<input type="text" id="expense-name" name="expense-name" required>
				</div>

				<div>
					<label for="expense-amount">Amount</label>
					<input type="number" id="expense-amount" name="expense-amount" min="0.01" step="0.01" required>
				</div>

				<div>
					<label for="expense-category">Category</label>
					<select id="expense-category" name="expense-category" required>
						<option value="">Select a category</option>
						<option value="food">Food</option>
						<option value="transport">Transport</option>
						<option value="housing">Housing</option>
                        <option value="gas">Gas</option>
						<option value="tricycle">Tricycle</option>
						<option value="other">Other</option>
					</select>
				</div>

				<div>
					<label for="expense-date">Date</label>
					<input type="date" id="expense-date" name="expense-date" required>
				</div>

				<p id="expense-error" role="alert" hidden></p>
				<button type="submit">Add Expense</button>
			</form>
		</section>

		<section aria-labelledby="expense-list-heading">
			<h2 id="expense-list-heading">Expenses</h2>
			<table>
				<thead>
					<tr>
						<th scope="col">Date</th>
						<th scope="col">Description</th>
						<th scope="col">Category</th>
						<th scope="col">Amount</th>
					</tr>
				</thead>
				<tbody id="expense-list">
					<tr>
						<td colspan="4">No expenses added yet.</td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
